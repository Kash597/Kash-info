version: '3.8'

# KASH_INFO - Local Development Environment
# Run with: docker-compose up -d

services:
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  # SUPABASE STACK (Self-Hosted)
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

  # PostgreSQL with pgvector
  postgres:
    image: supabase/postgres:15.1.0.117
    container_name: kash_info_postgres
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5434:5432"
    command: >
      postgres
      -c listen_addresses=*
      -c wal_level=logical
      -c max_replication_slots=5
      -c max_wal_senders=10
      -c shared_buffers=256MB
      -c max_connections=200
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - kash_info_network

  # PostgREST (Auto-generated REST API)
  rest:
    image: postgrest/postgrest:v11.2.0
    container_name: kash_info_rest
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGRST_DB_URI: postgresql://postgres:${POSTGRES_PASSWORD:-postgres}@postgres:5432/postgres
      PGRST_DB_SCHEMAS: public,storage,auth
      PGRST_DB_ANON_ROLE: anon
      PGRST_JWT_SECRET: ${JWT_SECRET:-super-secret-jwt-token-with-at-least-32-characters-long}
      PGRST_DB_POOL: 10
    ports:
      - "3030:3000"
    networks:
      - kash_info_network

  # GoTrue (Authentication)
  auth:
    image: supabase/gotrue:v2.99.0
    container_name: kash_info_auth
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:-postgres}@postgres:5432/postgres
      GOTRUE_SITE_URL: ${SITE_URL:-http://localhost:3001}
      API_EXTERNAL_URL: http://localhost:9998
      GOTRUE_JWT_SECRET: ${JWT_SECRET:-super-secret-jwt-token-with-at-least-32-characters-long}
      GOTRUE_JWT_EXP: 3600
      GOTRUE_SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
      GOTRUE_SMTP_PORT: ${SMTP_PORT:-587}
      GOTRUE_SMTP_USER: ${SMTP_USER:-your-email@gmail.com}
      GOTRUE_SMTP_PASS: ${SMTP_PASS:-your-app-password}
      GOTRUE_SMTP_ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@kashinfo.local}
      GOTRUE_MAILER_AUTOCONFIRM: ${AUTOCONFIRM_EMAIL:-true}
      GOTRUE_EXTERNAL_EMAIL_ENABLED: true
    ports:
      - "9998:8081"
    networks:
      - kash_info_network

  # Realtime (WebSocket subscriptions)
  realtime:
    image: supabase/realtime:v2.25.35
    container_name: kash_info_realtime
    restart: unless-stopped
    depends_on:
      - postgres
    environment:
      APP_NAME: kash_info_realtime
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      DB_NAME: postgres
      SECRET_KEY_BASE: ${JWT_SECRET:-super-secret-jwt-token-with-at-least-32-characters-long}
      PORT: 4000
      MAX_CLIENTS: 1000
    ports:
      - "4040:4000"
    networks:
      - kash_info_network

  # Storage (S3-compatible file storage)
  storage:
    image: supabase/storage-api:v0.43.11
    container_name: kash_info_storage
    restart: unless-stopped
    depends_on:
      - postgres
      - rest
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:-postgres}@postgres:5432/postgres
      PGRST_JWT_SECRET: ${JWT_SECRET:-super-secret-jwt-token-with-at-least-32-characters-long}
      ANON_KEY: ${ANON_KEY:-eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6ImFub24iLCJleHAiOjE5ODM4MTI5OTZ9.CRXP1A7WOeoJeXxjNni43kdQwgnWNReilDMblYTn_I0}
      SERVICE_ROLE_KEY: ${SERVICE_ROLE_KEY:-eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImV4cCI6MTk4MzgxMjk5Nn0.EGIM96RAZx35lJzdJsyH-qQwv8Hdp7fsn3W0YpN81IU}
      FILE_SIZE_LIMIT: 52428800  # 50MB
      STORAGE_BACKEND: file
      FILE_STORAGE_BACKEND_PATH: /var/lib/storage
      TENANT_ID: stub
    volumes:
      - storage_data:/var/lib/storage
    ports:
      - "5050:5000"
    networks:
      - kash_info_network

  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  # VECTOR DATABASE & CACHE
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

  # Qdrant (Vector Database)
  qdrant:
    image: qdrant/qdrant:v1.12.0
    container_name: kash_info_qdrant
    restart: unless-stopped
    volumes:
      - qdrant_storage:/qdrant/storage
    ports:
      - "6333:6333"  # HTTP API
      - "6334:6334"  # gRPC API
    environment:
      - QDRANT__SERVICE__GRPC_PORT=6334
      - QDRANT__LOG_LEVEL=INFO
      - QDRANT__SERVICE__HTTP_PORT=6333
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:6333/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - kash_info_network

  # Redis (Caching)
  redis:
    image: redis:7-alpine
    container_name: kash_info_redis
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - kash_info_network

networks:
  kash_info_network:
    driver: bridge

volumes:
  postgres_data:
  storage_data:
  qdrant_storage:
  redis_data:
