[project]
name = "kash-info-backend"
version = "0.1.0"
description = "Elite membership platform with AI-powered tools - Backend API"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Kash Ghasemi", email = "kash@kashinfo.com" }
]
license = { text = "MIT" }
keywords = ["fastapi", "ai", "membership", "rag", "pydantic-ai"]

dependencies = [
    # Core Framework
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",

    # Database & ORM
    "sqlalchemy>=2.0.36",
    "alembic>=1.13.3",
    "asyncpg>=0.29.0",
    "psycopg2-binary>=2.9.10",

    # Supabase & Auth
    "supabase>=2.9.0",
    "gotrue>=2.9.1",
    "postgrest-py>=0.17.2",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "python-multipart>=0.0.12",

    # AI & Agents
    "pydantic-ai>=0.0.15",
    "openai>=1.54.0",
    "anthropic>=0.39.0",
    "httpx>=0.27.0",

    # Vector Database & Embeddings
    "qdrant-client>=1.12.0",
    "tiktoken>=0.8.0",

    # Caching & Task Queue
    "redis>=5.2.0",
    "celery>=5.4.0",

    # Search & Scraping
    "duckduckgo-search>=6.3.0",
    "beautifulsoup4>=4.12.3",
    "requests>=2.32.0",

    # Utilities
    "python-dotenv>=1.0.1",
    "python-dateutil>=2.9.0",
    "pytz>=2024.2",
    "email-validator>=2.2.0",
    "Pillow>=11.0.0",

    # Monitoring & Logging
    "prometheus-client>=0.21.0",
    "loguru>=0.7.2",

    # Performance
    "msgspec>=0.18.6",
]

[project.optional-dependencies]
dev = [
    # Testing
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "httpx>=0.27.0",

    # Code Quality
    "ruff>=0.7.0",
    "mypy>=1.13.0",
    "pre-commit>=4.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
dev-dependencies = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.7.0",
    "mypy>=1.13.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
]
ignore = [
    "E501",  # line too long (handled by formatter)
    "B008",  # do not perform function calls in argument defaults
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"
addopts = [
    "--verbose",
    "--cov=app",
    "--cov-report=term-missing",
    "--cov-report=html",
]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_any_generics = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true

[[tool.mypy.overrides]]
module = [
    "supabase.*",
    "gotrue.*",
    "postgrest.*",
    "qdrant_client.*",
    "celery.*",
]
ignore_missing_imports = true
